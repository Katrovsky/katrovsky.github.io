baseURL = 'https://katrovsky.github.io/'
title = 'tail -f /dev/brain'
theme = 'PaperMod'
defaultContentLanguage = 'ru'
locale = 'ru-RU'
enableGitInfo = true
enableRobotsTXT = true
removePathAccents = true

[pagination]
  pagerSize = 20

[taxonomies]
  category = 'categories'
  tag = 'tags'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[params]
  description = 'Заметки, технические статьи и личные проекты'
  images = ['og-image.png']
  defaultTheme = 'auto'
  mainSections = ['posts']
  ShowReadingTime = true
  ShowWordCount = false
  ShowShareButtons = true
  ShareButtons = ['telegram']
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  UseHugoToc = true
  ShowRssButtonInSectionTermList = true
  disableSpecial1stPost = true

[params.homeInfoParams]
  Title = 'Привет! 👋'
  Content = 'Заметки, технические статьи и личные проекты.'

[[params.socialIcons]]
  name = 'twitch'
  url = 'https://twitch.tv/katrovsky'

[[params.socialIcons]]
  name = 'telegram'
  url = 'https://t.me/katrovsky'

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  ignoreLocation = true
  threshold = 0.3
  minMatchCharLength = 2
  limit = 20
  keys = [{ name = 'title', weight = 3 }, { name = 'description', weight = 2 }, { name = 'summary', weight = 1 }, { name = 'content', weight = 1 }]

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Статьи'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'categories'
    name = 'Категории'
    url = '/categories/'
    weight = 15
  [[menu.main]]
    identifier = 'search'
    name = 'Поиск'
    url = '/search/'
    weight = 20