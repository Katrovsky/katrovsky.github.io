baseURL = 'https://katrovsky.github.io/'
defaultContentLanguage = 'ru'
title = 'tail -f /dev/brain'
theme = 'PaperMod'

[languages]
  [languages.ru]
    languageName = "Русский"
    languageCode = "ru-ru"
    weight = 1
    title = 'tail -f /dev/brain'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params]
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShareButtons = ["telegram"]
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  removePathAccents = true

[params.cover]
  responsiveImages = true
  linkFullImages = true

[params.homeInfoParams]
  Title = "Привет! 👋"
  Content = "Заметки, технические статьи и личные проекты."

[[params.socialIcons]]
  name = "twitch"
  url = "https://twitch.tv/katrovsky"

[[params.socialIcons]]
  name = "telegram"
  url = "https://t.me/katrovsky"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Статьи"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "categories"
    name = "Категории"
    url = "/categories/"
    weight = 15
  [[menu.main]]
    identifier = "search"
    name = "Поиск"
    url = "/search/"
    weight = 20