{{- if .Param "ShowToc" }}
{{- $toc := .TableOfContents }}
{{- if findRE "<li" $toc 1 }} <details class="toc" {{ if (.Param "TocOpen" ) }}open{{ end }}>
    <summary accesskey="c" title="(Alt + C)">
        <span class="title">{{- i18n "toc" | default "Оглавление" }}</span>
    </summary>
    <div class="inner">
        {{- $toc -}}
    </div>
    </details>
    {{- end }}
    {{- end }}
