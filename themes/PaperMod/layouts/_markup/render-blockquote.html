{{- if eq .Type "alert" }}
{{- $titles := dict "note" "Заметка" "tip" "Совет" "important" "Важно" "warning" "Внимание" "caution" "Осторожно" }}
<blockquote class="alert alert-{{ .AlertType }}">
    <p class="alert-title">{{ index $titles .AlertType | default .AlertType }}</p>
    {{ .Text }}
</blockquote>
{{- else }}
<blockquote>
    {{ .Text }}
</blockquote>
{{- end }}
